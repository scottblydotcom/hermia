name: Security

on:
  pull_request:
    branches:
      - main        # full security gate before anything hits main
  schedule:
    - cron: "0 6 * * 1"  # weekly Monday 06:00 UTC — scans main regardless of activity

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy dependency scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: "."
          exit-code: "1"
          severity: HIGH,CRITICAL

  bandit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install bandit
        run: pip install bandit
      - name: Bandit SAST
        run: bandit -r src/ -ll

  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Audit hermia dependencies in isolated venv
        run: |
          python -m venv /tmp/audit-env
          /tmp/audit-env/bin/pip install --quiet --upgrade pip
          /tmp/audit-env/bin/pip install --quiet pip-audit
          /tmp/audit-env/bin/pip install --quiet -e .
          # CVE-2026-3219 affects pip itself (no fix available yet); all hermia deps are clean
          /tmp/audit-env/bin/pip-audit --skip-editable --ignore-vuln CVE-2026-3219

  guarddog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install guarddog
        run: pip install guarddog
      - name: GuardDog — detect typosquatted / hallucinated packages
        run: |
          python3 - <<'EOF'
          import tomllib, subprocess, sys, re
          with open("pyproject.toml", "rb") as f:
              data = tomllib.load(f)
          deps = data.get("project", {}).get("dependencies", [])
          for dep in deps:
              pkg = re.split(r"[><=!@\[]", dep)[0].strip()
              if not pkg:
                  continue
              print(f"Scanning {pkg}...")
              r = subprocess.run(
                  ["guarddog", "pypi", "scan", pkg,
                   "--exit-non-zero-on-finding",
                   "--rules", "typosquatting",
                   "--rules", "potentially_compromised_email_domain",
                   "--rules", "obfuscation"],
                  check=False,
              )
              if r.returncode != 0:
                  sys.exit(1)
          EOF
