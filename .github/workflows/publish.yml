name: Publish to PyPI

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src/ tests/

      - name: Type check (mypy)
        run: mypy src/

      - name: Test (pytest)
        run: pytest tests/

  build-and-publish:
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.11"

      - name: Install build
        run: pip install build==1.5.0

      - name: Build
        run: python -m build

      - name: Publish to PyPI
        # Pinned to the release/v1 HEAD commit (GitHub builds Docker actions from the pinned
        # ref). Dependabot (github-actions ecosystem) bumps this SHA as PyPA ships updates.
        # v1.14.2 (twine 7.0.0, packaging 26.2). The previous pin's twine 6.1.0 rejected the
        # Metadata-Version 2.5 that current hatchling writes, which failed the v0.2.1 upload.
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
